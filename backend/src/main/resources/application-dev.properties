# ============================================================
# MAGBO Access Control - DEV Environment (In-Memory H2)
# ============================================================

# --- Server ---
server.port=8080

# --- H2 Database (Memory) ---
spring.datasource.url=jdbc:h2:mem:magbo_access;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Web Console to inspect DB at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- SQL Init (popula data.sql apos Hibernate criar as tabelas) ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Admin PIN (dev default) ---
admin.pin=1234

# JWT Configuration
# Secret base64 -- SUBSTITUIR EM PROD via env var
magbo.jwt.secret=ZGV2c2VjcmV0Y2hhbmdlbWVpbnByb2QwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkw
magbo.jwt.expiration-ms=28800000

# Admin inicial (troca a senha apos primeiro login!)
magbo.admin.username=admin
magbo.admin.password=admin1234
magbo.admin.nome=Administrador MAGBO

# Webhook token de DEV (permite testes locais sem env var)
magbo.webhook.token=dev-webhook-token

# --- Políticas de decisão de acesso ---
# OBSERVATION = registra o acesso normalmente E registra a tentativa para auditoria
# DENY        = NÃO registra acesso; registra apenas a tentativa negada
# ATENÇÃO: DENY é uma decisão LÓGICA do MAGBO. O backend NÃO bloqueia porta
# fisicamente (o terminal decide localmente e notifica depois). Bloqueio físico
# real só existe distribuindo access levels pelo HikCentral.
magbo.policy.meal-not-entitled=DENY
magbo.policy.meal-pending=OBSERVATION
magbo.policy.outside-meal-time=OBSERVATION
magbo.policy.duplicate-meal=OBSERVATION
magbo.policy.exit-not-authorized=DENY
magbo.policy.user-inactive=DENY
# FALLBACK = terminal sem mapeamento cai no comportamento legado (PORT1+ENTRADA)
# ATTEMPT  = terminal sem mapeamento gera tentativa MISSING_DOOR_MAPPING
magbo.policy.missing-door-mapping=FALLBACK

# --- Deduplicação de eventos ---
magbo.dedup.enabled=true
magbo.dedup.window-seconds=90

# Mesma passagem: leitura repetida da MESMA face em segundos (evento novo, nao
# reentrega). Janela por pessoa+ponto+acao. Ver application.properties.
magbo.same-passage-window-seconds=30

# Visita curta demais nao conta como visita no relatorio. Ver application.properties.
magbo.report.min-visit-seconds=60

# Fechamento automatico de presencas. Ver application.properties.
magbo.presence.auto-close.enabled=true
magbo.presence.auto-close.cron=0 */5 * * * *
magbo.presence.auto-close.times[BIBLIO]=17:00
# Cantina: inerte ate o piloto (sem movimento em REFEI1, nada a fechar).
# Justificativa e o alerta de horario estao em application.properties.
magbo.presence.auto-close.times[REFEI1]=15:00

# --- Dedup de INGESTÃO do webhook (reentrega do MESMO pacote) ---
magbo.ingestion-dedup.enabled=true
magbo.ingestion-dedup.ttl-seconds=60
magbo.ingestion-dedup.heartbeat-log-seconds=600
magbo.ingestion-dedup.max-entries=10000

# --- Cameras da PORTARIA (DeepinView iDS-2CD7A46G2) ---
# Limiar de similaridade para tratar uma comparacao facial como RECONHECIMENTO.
# So vale quando o payload nao traz o FDLibThreshold da propria biblioteca — o
# da camera tem precedencia, porque quem configurou a lista decidiu o rigor dela.
# Abaixo do limiar o evento vira tentativa negada (UNKNOWN_FACE): na portaria,
# "achou parecido" nao pode virar "achou".
# Escala 0..1; o payload mistura fracao (maxsimilarity 0.17) com percentual
# (FDLibThreshold 70) e o codigo normaliza os dois.
magbo.camera.similarity-threshold=0.70
