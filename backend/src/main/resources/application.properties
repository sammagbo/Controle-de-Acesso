# =====================================================
# MAGBO Access Control - Application Properties
# =====================================================

spring.profiles.active=dev

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- PostgreSQL DataSource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/magbo_access}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Jackson ---
# DB uses timestamp without time zone stored in local time (BRT).
# Do NOT set hibernate.jdbc.time_zone — it would shift reads by UTC offset.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# --- Pronote Sync ---
pronote.sync.cron=0 0 3 * * ?
pronote.sync.filepath=./ftp_drop/export_pronote.csv
# Pronote data source: csv (default) or api
pronote.source=csv
# Pronote API (filled when IT provides credentials)
pronote.api.url=
pronote.api.token=

# --- População de Testes QA ---
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# --- Admin PIN ---
admin.pin=${ADMIN_PIN:1234}

# Webhook agora e deny-by-default; token de DEV abaixo permite testes locais com header.
magbo.webhook.token=${MAGBO_WEBHOOK_TOKEN:dev-webhook-token}

# --- Políticas de decisão de acesso ---
# OBSERVATION = registra o acesso normalmente E registra a tentativa para auditoria
# DENY        = NÃO registra acesso; registra apenas a tentativa negada
# ATENÇÃO: DENY é uma decisão LÓGICA do MAGBO. O backend NÃO bloqueia porta
# fisicamente (o terminal decide localmente e notifica depois). Bloqueio físico
# real só existe distribuindo access levels pelo HikCentral.
magbo.policy.meal-not-entitled=DENY
magbo.policy.meal-pending=OBSERVATION
magbo.policy.outside-meal-time=OBSERVATION
magbo.policy.duplicate-meal=OBSERVATION
magbo.policy.exit-not-authorized=DENY
magbo.policy.user-inactive=DENY
# FALLBACK = terminal sem mapeamento cai no comportamento legado (PORT1+ENTRADA)
# ATTEMPT  = terminal sem mapeamento gera tentativa MISSING_DOOR_MAPPING
magbo.policy.missing-door-mapping=FALLBACK

# --- Deduplicação de eventos ---
magbo.dedup.enabled=true
magbo.dedup.window-seconds=90

# --- Mesma passagem (leitura repetida da mesma face) ---
# NÃO confundir com os outros dois dedups:
#   magbo.ingestion-dedup.*  = o aparelho REENVIOU o mesmo pacote (mesmo serialNo)
#   magbo.dedup.*            = regra de NEGÓCIO da cantina (2ª refeição no dia)
#   este                     = o terminal reconheceu a MESMA pessoa duas vezes
#                              em segundos, gerando eventos DIFERENTES (serialNo
#                              novo, então o dedup de ingestão deixa passar — e
#                              deve mesmo).
# Produção 03/08: mesmo aluno, ENTRADA às 10:06:50 e de novo às 10:06:51.
# Janela por (pessoa + ponto + ação): ENTRADA seguida de SAIDA continua valendo.
magbo.same-passage-window-seconds=30

# --- Camada de RELATÓRIO (só exibição/agregação; nada é apagado) ---
# Visita completa (ENTRADA→SAIDA, mesma pessoa, mesmo ponto) mais curta que
# isto não conta como visita nas estatísticas do CDI, nem entra na média de
# permanência: quem entra para dar um recado e sai não teve "permanência".
# ⚠️ NÃO confundir com magbo.same-passage-window-seconds (30s), que é regra de
# INGESTÃO e descarta a segunda leitura. Esta aqui não descarta linha nenhuma —
# access_logs continua intacto e o Journal segue listando tudo.
magbo.report.min-visit-seconds=60

# --- Teto de duração: o par longo demais é uma SAÍDA PERDIDA, não uma visita ---
#
# ⚠️ ESTES DOIS NÚMEROS SÃO UMA AFIRMAÇÃO SOBRE ESTA ESCOLA, NÃO UMA LEI.
# Vieram de quem dirige o CDI (12/08/2026): "ninguém fica mais de DUAS HORAS no
# CDI" e "ninguém fica mais de UMA HORA sem sair e voltar". Outra escola — ou
# este mesmo CDI depois de uma reforma de horário — teria outros números, e é
# por isso que eles vivem aqui e não dentro de uma consulta.
#
# POR QUE UM TETO. O leitor facial perde saídas (medido em produção em
# 12/08/2026 no CDI: 121 ENTRADA contra 70 SAIDA). Quando a saída se perde e a
# pessoa REENTRA, a regra JA_PRESENTE tira a reentrada do emparelhamento — e aí
# o par formado vai da entrada ORIGINAL até a saída de horas depois. Esse par
# não é uma visita longa: é o retrato de uma saída que ninguém registrou.
#
# O que o teto faz: o par acima dele fica FORA das estatísticas de duração —
# não é evidência de nada. ⚠️ NADA É APAGADO NEM ALTERADO: as linhas seguem em
# access_logs e o Journal continua listando cada uma, exatamente como acontece
# com a visita curta e com o fechamento automático.
magbo.report.max-visit-seconds=7200

# Permanência contínua máxima ANTES de a pessoa normalmente sair e voltar.
# Não exclui nada: o par entre este valor e o teto acima CONTA na média, mas é
# somado à parte e devolvido como `implausibleIgnored`/`longVisits` para a tela
# poder dizer quanta da média está na faixa que o CDI diz não existir. Serve
# para calibrar o teto com dado, em vez de com opinião.
magbo.report.max-continuous-presence-seconds=3600

# --- Fechamento automático de presenças ---
# O CDI fecha às 17:00 e ninguém dorme lá dentro, mas a presença deriva do
# ÚLTIMO evento: quem não passa o rosto na saída fica "dentro" para sempre.
# O job grava uma SAIDA sintética (flag=FECHAMENTO_AUTO, created_by_user=system
# — declarada, nunca disfarçada de crachá) carimbada na HORA DE FECHAMENTO,
# não na hora em que o job rodou.
# Roda a cada 5 min e fecha todo ponto cuja hora já passou: se o backend estiver
# parado às 17:00, o fechamento acontece assim que ele voltar. É idempotente.
# Um ponto por linha.
magbo.presence.auto-close.enabled=true
magbo.presence.auto-close.cron=0 */5 * * * *
magbo.presence.auto-close.times[BIBLIO]=17:00
# CANTINA — INERTE ATE O PILOTO.
# A cantina tem exatamente o mesmo problema do CDI: a presenca deriva do ULTIMO
# evento, e quem entra e nao passa o rosto na saida fica "dentro" para sempre.
# Enquanto REFEI1 nao tiver movimento, esta linha nao fecha nada: o job so age
# sobre quem tem ENTRADA aberta no dia.
# 15:00 = fim da janela de almoco do Lycee (LYCEE_END em AccessDecisionService).
# ⚠️ CONFERIR COM A CANTINA antes do dia 1: se o servico terminar mais tarde,
# uma pessoa que ainda estiver la dentro leva uma SAIDA sintetica das 15:00 e
# some do painel. Um ponto por linha — nao ha lista separada por virgula.
magbo.presence.auto-close.times[REFEI1]=15:00

# --- Dedup de INGESTÃO do webhook (reentrega do MESMO pacote) ---
# Não confundir com magbo.dedup.* acima: aquele é regra de NEGÓCIO (mesma
# pessoa/ponto na cantina); este é infraestrutura (o aparelho reenviou o mesmo
# evento, mesmo serialNo). Chave = (IP de origem, serialNo).
# ttl-seconds=60: o loop observado reenvia a ~1/s, então 60s cobre a reentrega
# com folga — e é curto o bastante para nunca alcançar duas passagens REAIS da
# mesma pessoa. Descarte sempre deixa uma linha INFO com ip + serialNo.
magbo.ingestion-dedup.enabled=true
magbo.ingestion-dedup.ttl-seconds=60
# Janela SEPARADA, só para limitar o INFO de heartbeat (~30s por aparelho).
# É higiene de log, não descarte de evento — não encurta junto com o TTL.
magbo.ingestion-dedup.heartbeat-log-seconds=600
magbo.ingestion-dedup.max-entries=10000

# --- Cameras da PORTARIA (DeepinView iDS-2CD7A46G2) ---
# Limiar de similaridade para tratar uma comparacao facial como RECONHECIMENTO.
# So vale quando o payload nao traz o FDLibThreshold da propria biblioteca — o
# da camera tem precedencia, porque quem configurou a lista decidiu o rigor dela.
# Abaixo do limiar o evento vira tentativa negada (UNKNOWN_FACE): na portaria,
# "achou parecido" nao pode virar "achou".
# Escala 0..1; o payload mistura fracao (similarity 0.95 / maxsimilarity 0.13)
# com percentual (FDLibThreshold 70) e o codigo normaliza os dois.
magbo.camera.similarity-threshold=0.70

# Tamanho do multipart das cameras da portaria.
# O default do Spring e 1MB por arquivo. Na captura de 07/08/2026 cada evento
# da camera .167 trouxe uma part "backgroundImage" de 453-467KB (cena inteira,
# 2560x1504) alem da "faceImage" e, quando ha comparacao, da "faceLibImage" —
# requisicoes de ~466KB, ja perto da METADE do limite. Uma cena mais carregada
# passa de 1MB, e ai o Spring estoura ANTES do controller: a camera leva 500,
# entra em loop de reenvio e a passagem se perde sem deixar rastro no MAGBO.
# As imagens sao descartadas de qualquer forma (o MAGBO nao guarda biometria);
# o limite alto so evita a falha, nao guarda nada.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ⚠️⚠️ RESOLUCAO PREGUICOSA, E DELA DEPENDE O WEBHOOK DA CANTINA.
#
# Com o default (`false`), o resolvedor do Spring chama `request.getParts()` no
# CONSTRUTOR do StandardMultipartHttpServletRequest — ou seja, ANTES de o
# controller correr. Duas consequencias, ambas medidas em 24/08/2026:
#
#  1. o fluxo chega ao controller JA CONSUMIDO, e o
#     HikvisionWebhookController deixa de conseguir ler os bytes crus. Com a
#     leitura tolerante (MultipartTolerante) isso dava "corpo vazio ou sem
#     part JSON" em TODAS as requisicoes, inclusive nas bem formadas;
#  2. um corpo cortado pelo aparelho estoura dentro do resolvedor, antes de
#     qualquer codigo nosso — sem hipotese de salvar a part JSON que ja tinha
#     chegado inteira. Foi assim que a cantina perdeu 95 eventos num dia.
#
# Com `true`, o corpo so e interpretado quando alguem pede as parts. O webhook
# nao pede (le os bytes e interpreta ele proprio, toleravelmente); os dois
# ecrans que usam MultipartFile — importacao do HikCentral e fotos — pedem, e
# continuam a funcionar exatamente como antes, so que no momento do binding.
spring.servlet.multipart.resolve-lazily=true

# --- Fotos de identificacao ---
# ⚠️ Os limites de multipart ACIMA sao das cameras e NAO foram tocados para a
# importacao de fotos. Um ZIP de ~1200 retratos passa dos 20MB, e por isso ele
# entra por outro caminho: corpo cru (application/zip), que nao passa pelo
# resolvedor de multipart. Subir aquele numero por causa de uma tela de
# administracao seria afrouxar a guarda do caminho mais critico do sistema.
#
# Teto por imagem. 2MB e generoso para um retrato de cracha (~20KB) e recusa o
# que so pode ser engano — a foto de 8MP arrastada direto da camera. Sem teto,
# 1200 arquivos desses seriam ~10GB no banco, e o erro so apareceria no dia do
# backup.
magbo.photos.max-bytes=2097152
# Teto de arquivos por lote enviado.
magbo.photos.max-arquivos-por-lote=2000
# Guardas do ZIP: numero de entradas e total DESCOMPRIMIDO (zip bomb).
magbo.photos.zip.max-entradas=5000
magbo.photos.zip.max-total-bytes=268435456

# ── LINK TOTVS (prontuário da enfermaria) ────────────────────────────
# ⚠️ NASCE VAZIO = funcionalidade DESLIGADA. O MAGBO monta um LINK e nunca
# guarda dado de saúde. O padrão de URL e o identificador que o TOTVS espera
# são DESCONHECIDOS nesta data — as quatro perguntas para a DSI estão em
# docs/integracao/totvs.md. Ligar é esta linha, não uma reescrita.
# Fichas: {matricula} (TEXTO, com zeros à esquerda) · {hikvision} · {nome}
magbo.totvs.url-pattern=
magbo.totvs.rotulo=TOTVS

# ── RÉGIME DE SORTIE (V014) ──────────────────────────────────────────
# O direito ANUAL de sair, fixado por escrito pelos responsáveis legais.
# Circulaire n° 96-248 du 25 octobre 1996.
#
# ⚠️ Os dois horários são AFIRMAÇÕES SOBRE ESTA ESCOLA, não leis — é por isso
# que vivem aqui e não em constantes. Fim da manhã encerra o dia letivo do
# aluno EXTERNE (ele almoça fora); o demi-pensionnaire só termina no fim do dia.
magbo.regime.fim-manha=12:00
magbo.regime.fim-dia=17:00
# Folga antes do sino: sem ela, quem passa às 11h58 recebe vermelho e quem
# passa às 12h01 recebe verde — diferença que ninguém explica a um pai.
magbo.regime.tolerancia-minutos=15
# Retomada da tarde: fecha a janela do meio-dia. SEM ISTO o externo recebia
# "fim de jornada — saída normal" das 11h45 até a meia-noite, inclusive para
# regime 1 (apanhado pelo painel de revisão em 14/08). As TRÊS fronteiras do
# dia moram aqui; deixar uma só no default do Java esconderia dela quem
# configura as outras duas.
magbo.regime.retomada-tarde=14:00
# ⚠️ OBSERVATION obrigatoriamente até os regimes serem carregados. No dia 1
# nenhum dos 923 alunos tem regime; DENY antes disso pinta a escola inteira de
# vermelho e mata os alertas que importam (mesma lição de meal-pending, D5).
magbo.regime.desconhecido=OBSERVATION
# ⚠️ NASCE DESLIGADO. Ligar ANTES de aplicar a V015 arma uma falha adiada: o
# CHECK de access_attempts.denial_reason ainda não conhece REGIME_NOT_ALLOWED,
# e o INSERT da tentativa estoura DENTRO da transação — derrubando junto o
# access_log de uma passagem real. Ligar só depois da migração aplicada e dos
# regimes carregados (ver deploy/migrations/README.md).
magbo.regime.habilitado=false

# =====================================================================
# CANTINA — horarios e duracoes DESTA escola
# =====================================================================
# ⚠️ Ate 24/08/2026 estes cinco numeros eram `static final` dentro do
# AccessDecisionService (LYCEE_START, LYCEE_END, MAX_CANTINA_TIME): mudar a
# hora do almoco exigia editar Java e redistribuir o jar. Sairam para ca pela
# mesma razao que os de magbo.regime — sao afirmacoes sobre ESTA escola.
#
# ⚠️ A REGRA nao mudou: `validateEntryWindow` continua a aplicar a janela por
# turma, com a excecao das oito turmas do liceu. So os numeros sairam do codigo.
magbo.cantine.lycee-inicio=11:00
magbo.cantine.lycee-fim=15:00

# As tres faixas de duracao da refeicao saem de DOIS numeros:
#   < 15 min          passagem curta — entrou, provavelmente nao comeu (marcador em SORTIS)
#   15 a 30 min       normal
#   > 30 min          excessiva — a linha vai para DOIT SORTIR (flag EXCEDEU_TEMPO)
# O teto era 1 HORA e passou a 30 min por decisao do Sam: uma hora e mais do que
# o servico inteiro de uma turma, entao o alerta quase nunca disparava.
magbo.cantine.duracao-curta-minutos=15
magbo.cantine.duracao-maxima-minutos=30

# DECANTACAO: quanto tempo uma linha fica visivel na coluna DOIT SORTIR antes de
# passar para a pastilha do cabecalho. Nao e remocao — continua contada e a lista
# inteira abre num clique.
magbo.cantine.decantacao-minutos=15
