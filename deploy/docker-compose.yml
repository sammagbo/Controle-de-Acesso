# ⚠️ Le volume ./licence:/licence:ro est INDISPENSABLE. Sans lui, le backend
# ne trouve pas la licence et /api/health repond "motif":"ABSENTE" — cela
# ressemble a une echeance et n'en est pas une. Arrive les 01/09 et 04/09.
# TZ: America/Sao_Paulo sur les DEUX conteneurs — sans lui ils naissent en UTC
# et les horodatages partent 3 heures dans le futur.
# ADMIN_PIN et MAGBO_ADMIN_PASSWORD doivent exister dans deploy/.env, sinon
# `docker compose up` echoue — c'est voulu.
services:
  postgres:
    image: postgres:16-alpine
    container_name: magbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magbodb}
      POSTGRES_USER: ${POSTGRES_USER:-magbo}
      TZ: America/Sao_Paulo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
    volumes:
      - magbo_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magbo} -d ${POSTGRES_DB:-magbodb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:17-jre-alpine
    container_name: magbo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-magbodb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-magbo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
      MAGBO_JWT_SECRET: ${MAGBO_JWT_SECRET}
      # ⚠️ RÉGIME DE SORTIE — a única chave que liga a funcionalidade inteira.
      # Nasce FALSE dentro do jar, e o jar não se edita na VM: sem esta linha,
      # ligar o regime exigia rebuild. Ligar SÓ DEPOIS de aplicar a V015
      # (deploy/migrations/README.md) — antes disso o INSERT da tentativa estoura
      # dentro da transação e derruba junto o access_log de uma passagem real.
      MAGBO_REGIME_HABILITADO: ${MAGBO_REGIME_HABILITADO:-false}
      MAGBO_WEBHOOK_TOKEN: ${MAGBO_WEBHOOK_TOKEN:-}
      MAGBO_ADMIN_PASSWORD: ${MAGBO_ADMIN_PASSWORD}
      ADMIN_PIN: ${ADMIN_PIN}
    ports:
      - "8080:8080"
    volumes:
      - ../backend/target:/app
      - ./licence:/licence:ro
    working_dir: /app
    command: ["sh", "-c", "java -jar access-control-*.jar"]

volumes:
  magbo_pg_data:
    name: magbo_pg_data
