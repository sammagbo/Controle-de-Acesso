<!DOCTYPE html>
<html lang="pt-BR">

<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>MAGBO Access Control — Lycée Molière</title>
      <meta name="description" content="Sistema de Controle de Acesso Institucional — Lycée Molière" />

      <!-- Tailwind CSS (vendorizado R1, Play CDN v3.4.17) -->
      <script src="libs/tailwindcss-play-3.4.17.js"></script>
      <!-- React + ReactDOM (vendorizado R1, v18.3.1) -->
      <script src="libs/react-18.3.1.min.js"></script>
      <script src="libs/react-dom-18.3.1.min.js"></script>
      <!-- Babel for JSX (vendorizado R1, @babel/standalone v8.0.4) -->
      <script src="libs/babel-standalone-8.0.4.min.js"></script>
      <!-- Lucide Icons (vendorizado R1, v1.24.0) -->
      <script src="libs/lucide-1.24.0.min.js"></script>
      <!-- jsPDF & AutoTable (vendorizado R1, v2.5.1 / v3.5.28) -->
      <script src="libs/jspdf-2.5.1.umd.min.js"></script>
      <script src="libs/jspdf-autotable-3.5.28.min.js"></script>
      <!-- Fontes locais: Inter / Playfair Display / Caveat (vendorizado R1, woff2 em libs/fonts/) -->
      <link rel="stylesheet" href="libs/fonts.css" />

      <!-- Tailwind Config -->
      <script>
            tailwind.config = {
                  theme: {
                        extend: {
                              fontFamily: {
                                    sans: ['Inter', 'sans-serif'],
                                    serif: ['Playfair Display', 'Georgia', 'serif'],
                                    script: ['Caveat', 'cursive'],
                              },
                              colors: {
                                    navy: { 50: '#E8EBF0', 100: '#C5CAD6', 200: '#8E97AD', 300: '#576585', 400: '#2E3F66', 500: '#0C1B3A', 600: '#0A1730', 700: '#081226', 800: '#060D1C', 900: '#030812' },
                                    soft: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1' },
                                    accent: { 400: '#60A5FA', 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' },
                                    success: { 50: '#ECFDF5', 100: '#D1FAE5', 500: '#10B981', 600: '#059669' },
                                    danger: { 50: '#FEF2F2', 100: '#FEE2E2', 500: '#EF4444', 600: '#DC2626' },
                                    warning: { 50: '#FFFBEB', 100: '#FEF3C7', 500: '#F59E0B', 600: '#D97706' },
                                    lycee: { 400: '#6BD2DD', 500: '#48C3D2', 600: '#3AA3B0', 700: '#2E848F' },
                              }
                        }
                  }
            };
      </script>

      <!-- Custom Styles -->
      <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
      <div id="root"></div>

      <!-- i18n (FR/PT) — o PRIMEIRO script de js/: até as camadas HTTP e o
           auth traduzem suas mensagens de erro por window.MagboI18n (com
           fallback lazy — a leitura é em tempo de chamada, nunca de carga).
           init() lê a preferência da MÁQUINA no localStorage. -->
      <script type="text/babel" src="js/utils/i18n.js?v=1"></script>
      <!-- Auth Utility -->
      <!-- Regras do retrato do PPMS (chave + quando apagar). ANTES do auth,
           que as usa no logout. Script clássico, como o auth. -->
      <script src="js/utils/ppmsCache.js?v=1"></script>
      <script src="js/utils/auth.js?v=1"></script>
      <!-- A ligação do i18n com o React (hook useI18n). Separada porque
           i18n.js é puro e testado sem React; esta precisa dele carregado. -->
      <script type="text/babel" src="js/utils/i18nReact.js?v=1"></script>
      <script type="text/babel">window.MagboI18n.init();</script>
      <!-- UI Configuration (access points, visual labels, category colors) -->
      <script type="text/babel" src="js/data/constants.js?v=1"></script>
      <!-- API -->
      <script type="text/babel" src="js/api.js?v=2"></script>
      <!-- Utilities -->
      <!-- Lógica pura, testável com `npm test` (Vitest). Formato UMD: expõem
           window.MagboReport / MagboHikSheet / MagboListPaging aqui e
           module.exports no Node. Carregam ANTES dos componentes, que as usam. -->
      <script type="text/babel" src="js/utils/reportFilters.js?v=1"></script>
      <!-- As regras do Moniteur Cantine (colunas, faixas de duração,
           decantação). ⚠️ ANTES do reportConfig: é ele quem entrega a este
           módulo o bloco `cantine` da MESMA resposta que traz o piso de
           visita. Carregado depois, o consumidor não o encontrava. -->
      <script type="text/babel" src="js/utils/cantine.js?v=1"></script>

      <script type="text/babel" src="js/utils/reportConfig.js?v=1"></script>
      <script type="text/babel" src="js/utils/importPlan.js?v=1"></script>
      <script type="text/babel" src="js/utils/hikcentralSheet.js?v=1"></script>
      <script type="text/babel" src="js/utils/listPaging.js?v=1"></script>
      <script type="text/babel" src="js/utils/barChart.js?v=1"></script>
      <script type="text/babel" src="js/utils/identity.js?v=1"></script>
      <!-- Trava de requisição em voo (SectorView). Utilitário: carrega com
           os outros utilitários, antes de qualquer componente. -->
      <script type="text/babel" src="js/utils/travaDeVoo.js?v=1"></script>
      <script type="text/babel" src="js/utils/postoFixo.js?v=1"></script>
      <script type="text/babel" src="js/utils/photoCache.js?v=1"></script>
      <script type="text/babel" src="js/utils/permissions.js?v=1"></script>
      <script type="text/babel" src="js/utils/mealEntitlement.js?v=1"></script>
      <!-- mealSheet REUSA os helpers de cabeçalho do hikcentralSheet: carrega depois dele. -->
      <script type="text/babel" src="js/utils/mealSheet.js?v=1"></script>
      <!-- importColumns REUSA a documentação de colunas do mealSheet (para não
           ter duas verdades sobre a mesma planilha): carrega depois dele. -->
      <!-- regimeSheet REUSA os helpers de cabecalho do hikcentralSheet, como o
           mealSheet: carrega depois dele e ANTES do importColumns, que o consome. -->
      <script type="text/babel" src="js/utils/regimeSheet.js?v=1"></script>
      <script type="text/babel" src="js/utils/importColumns.js?v=1"></script>
      <script type="text/babel" src="js/utils/exitPermission.js?v=1"></script>
      <script type="text/babel" src="js/utils/helpers.js?v=10"></script>
      <script type="text/babel" src="js/utils/api.js?v=10"></script>
      <script type="text/babel" src="js/utils/userCache.js?v=2"></script>
      <script type="text/babel" src="js/utils/audio.js?v=1"></script>
      <script type="text/babel" src="js/utils/connectionMonitor.js?v=1"></script>
      <!-- Components -->
      <!-- ⚠️ ErrorBoundary PRIMEIRO entre os componentes, e a razão é literal:
           ele é a rede de quem vem depois. Um componente que se envolve num
           boundary que ainda não existe recebe `undefined` como tipo de
           elemento e quebra na renderização — exatamente o desastre que este
           arquivo existe para evitar, causado pela ordem do <script>. -->
      <script type="text/babel" src="js/components/ErrorBoundary.js?v=1"></script>
      <!-- ListaLimitada é usada pela aba HikCentral E pela importação de direitos
           de refeição: carrega antes das duas. -->
      <script type="text/babel" src="js/components/ListaLimitada.js?v=1"></script>
      <!-- PasswordInput é usado pelo LoginScreen E pela gestão de operadores:
           carrega junto dos compartilhados, antes de ambos. -->
      <script type="text/babel" src="js/components/PasswordInput.js?v=1"></script>
      <script type="text/babel" src="js/components/LanguageSelector.js?v=1"></script>
      <script type="text/babel" src="js/components/ImportColumnList.js?v=1"></script>
      <!-- PersonPhoto antes de qualquer tela que mostre gente: SectorView, o
           Rapport e o CDI o consomem. -->
      <script type="text/babel" src="js/components/PersonPhoto.js?v=1"></script>
      <script type="text/babel" src="js/components/ConnectionStatus.js?v=1"></script>
      <script type="text/babel" src="js/components/Toast.js?v=10"></script>
      <script type="text/babel" src="js/components/ActiveTimers.js?v=8"></script>
      <script type="text/babel" src="js/components/Header.js?v=8"></script>
      <script type="text/babel" src="js/components/Dashboard.js?v=8"></script>
      <!-- O veredicto do regime, lido no portão. Antes do SectorView, que o usa. -->
      <script type="text/babel" src="js/components/RegimeVerdictBadge.js?v=1"></script>
      <script type="text/babel" src="js/components/SectorView.js?v=8"></script>
      <script type="text/babel" src="js/components/DeniedAttemptsFeed.js?v=1"></script>
      <script type="text/babel" src="js/components/MealEntitlementHistoryModal.js?v=1"></script>
      <script type="text/babel" src="js/components/RechercheGlobale.js?v=1"></script>
      <script type="text/babel" src="js/components/MealEntitlementManagement.js?v=1"></script>
      <script type="text/babel" src="js/components/ExitPermissionManagement.js?v=1"></script>
      <!-- Régime de sortie: o direito ANUAL. Vizinho das autorizações pontuais
           acima porque são a mesma pergunta vista em duas escalas — o ano e o
           dia — e quem opera as duas é a mesma Vie Scolaire. -->
      <script type="text/babel" src="js/components/StudentRegimeManagement.js?v=1"></script>
      <script type="text/babel" src="js/components/PpmsView.js?v=1"></script>
      <script type="text/babel" src="js/components/CantineMonitor.js?v=1"></script>
      <script type="text/babel" src="js/components/RefectoryReport.js?v=1"></script>
      <script type="text/babel" src="js/components/InfirmaryReport.js?v=1"></script>
      <!-- A lista atrás do card de "Sorties non enregistrées". Carrega
           ANTES do GeneralReport, que a usa. -->
      <script type="text/babel" src="js/components/MouvementsIncomplets.js?v=1"></script>
      <script type="text/babel" src="js/components/GeneralReport.js?v=1"></script>
      <script type="text/babel" src="js/components/AccessModals.js?v=8"></script>
      <script type="text/babel" src="js/components/AdminDashboard.js?v=1"></script>

      <!-- XLSX Library (for CDI Excel import) -->
      <script src="libs/xlsx.min.js"></script>

      <!-- CDI SafeTrack Components (Biblioteca) -->
      <script type="text/babel" src="js/cdi/cdiData.js"></script>
      <script type="text/babel" src="js/cdi/CdiIcon.js"></script>
      <script type="text/babel" src="js/cdi/CdiToast.js"></script>
      <script type="text/babel" src="js/cdi/StatsModal.js"></script>
      <script type="text/babel" src="js/cdi/StudentManagerModal.js"></script>
      <script type="text/babel" src="js/cdi/SettingsModal.js"></script>
      <script type="text/babel" src="js/cdi/HistoryModal.js"></script>
      <script type="text/babel" src="js/cdi/HelpModal.js"></script>
      <script type="text/babel" src="js/cdi/LockScreen.js"></script>

      <!-- Local Backend (Single App Mode) -->
      <script type="text/babel" src="js/cdi/CdiBackend.js"></script>

      <!-- Painel "ainda dentro" do CDI: carrega ANTES do BibliotecaView,
           que o consome. O CDI é o único ponto com fechamento real. -->
      <script type="text/babel" src="js/components/FinDeJournee.js?v=1"></script>
      <script type="text/babel" src="js/cdi/BibliotecaView.js"></script>

      <!-- App -->
      <script type="text/babel" src="js/components/UserManagement.js?v=1"></script>
      <script type="text/babel" src="js/components/UserListPanel.js?v=1"></script>
      <script type="text/babel" src="js/components/AppSettingsModal.js?v=12"></script>
      <script type="text/babel" src="js/components/AdminPinModal.js?v=10"></script>
      <script type="text/babel" src="js/components/LoginScreen.js?v=1"></script>
      <script type="text/babel" src="js/App.js?v=9"></script>
</body>

</html>
